name: release
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repository
        uses: actions/checkout@v4
      - name: validate gradle wrapper
        uses: gradle/actions/wrapper-validation@v4
      - name: setup jdk
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'microsoft'
      - name: setup gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: true
      - name: read mod metadata
        id: mod
        run: |
          version=$(sed -n 's/^mod_version=//p' gradle.properties)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "mc=$(sed -n 's/^minecraft_version=//p' gradle.properties)" >> "$GITHUB_OUTPUT"
          case "$version" in
            *-alpha*|*-beta*|*-rc*) echo "prerelease=true" >> "$GITHUB_OUTPUT" ;;
            *) echo "prerelease=false" >> "$GITHUB_OUTPUT" ;;
          esac
      # a jar whose internal version disagrees with the tag is the classic
      # release footgun, so fail before anything is published
      - name: verify tag matches mod_version
        env:
          VERSION: ${{ steps.mod.outputs.version }}
        run: |
          if [ "${GITHUB_REF_NAME#v}" != "$VERSION" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match mod_version=$VERSION in gradle.properties"
            exit 1
          fi
      - name: make gradle wrapper executable
        run: chmod +x ./gradlew
      - name: build
        run: ./gradlew build
      - name: create github release
        env:
          GH_TOKEN: ${{ github.token }}
          PRERELEASE: ${{ steps.mod.outputs.prerelease }}
          TITLE: Electricity ${{ steps.mod.outputs.version }} (MC ${{ steps.mod.outputs.mc }})
        run: |
          args=(--generate-notes --title "$TITLE")
          if [ "$PRERELEASE" = "true" ]; then
            args+=(--prerelease)
          fi
          gh release create "$GITHUB_REF_NAME" "${args[@]}" build/libs/*.jar

  # the release above is created with the repository's GITHUB_TOKEN, which does
  # not fire the release event, so the package publish is chained explicitly
  publish-package:
    needs: release
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/publish-package.yml
    with:
      tag: ${{ github.ref_name }}

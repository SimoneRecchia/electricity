name: release
# nothing here starts on its own: no tag push, no merge. cutting a release is
# always a deliberate act, either from this workflow or from the github ui
on:
  workflow_dispatch:
    inputs:
      tag:
        description: existing tag to release; the version is taken from it
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
      # the version is whatever the tag says; gradle.properties does not get a vote
      - name: read release metadata
        id: meta
        env:
          TAG: ${{ inputs.tag }}
        run: |
          version=${TAG#v}
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "mc=$(sed -n 's/^minecraft_version=//p' gradle.properties)" >> "$GITHUB_OUTPUT"
          case "$version" in
            *-alpha*|*-beta*|*-rc*) echo "prerelease=true" >> "$GITHUB_OUTPUT" ;;
            *) echo "prerelease=false" >> "$GITHUB_OUTPUT" ;;
          esac
      - name: create github release
        env:
          GH_TOKEN: ${{ github.token }}
          PRERELEASE: ${{ steps.meta.outputs.prerelease }}
          TITLE: Electricity ${{ steps.meta.outputs.version }} (MC ${{ steps.meta.outputs.mc }})
          TAG: ${{ inputs.tag }}
        run: |
          # the release may already exist, cut by hand from the ui; that used to
          # fail the whole job and take the jar with it
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "release $TAG already exists, leaving its notes alone"
            exit 0
          fi
          args=(--generate-notes --title "$TITLE")
          if [ "$PRERELEASE" = "true" ]; then
            args+=(--prerelease)
          fi
          gh release create "$TAG" "${args[@]}"

  # a release created with the repository's GITHUB_TOKEN does not fire the release
  # event, so the publish is chained explicitly. it is also what builds the jar and
  # attaches it to the release
  publish-package:
    needs: release
    permissions:
      contents: write
      packages: write
    uses: ./.github/workflows/publish-package.yml
    with:
      tag: ${{ inputs.tag }}
